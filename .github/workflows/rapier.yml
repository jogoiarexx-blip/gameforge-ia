name: Física Rapier opcional
on:
  pull_request:
    paths:
      - 'js/rapier-physics.js'
      - 'scripts/vendor-rapier.cjs'
      - 'tests/rapier-real.integration.cjs'
      - 'package.json'
      - '.github/workflows/rapier.yml'
  push:
    branches: [main]
    paths: ['js/rapier-physics.js','scripts/vendor-rapier.cjs','tests/rapier-real.integration.cjs','package.json','.github/workflows/rapier.yml']
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run test:rapier
      - run: npm run vendor:rapier
