name: Validar GameForge Studio
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: Sintaxe e regressões (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxe dos módulos
        shell: bash
        run: |
          for f in js/*.js; do node --check "$f"; done
      - name: Testes automatizados
        run: npm test
      - name: GF-TRAIN-19 — avaliar 50 briefs Three.js multigenero
        run: npm run train:threejs
      - name: GF-TRAIN-22 — avaliar 47 briefs inspirados no Prismal Voxel
        run: npm run train:voxel
      - name: Bloquear exportacoes com codigo invalido
        run: npm run verify:exports
      - name: Benchmark informativo da arena
        run: npm run bench:arena

  browser:
    name: Exportações reais no Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout do mesmo commit
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Construir exemplos reais para o navegador
        run: node tools/build-browser-fixtures.cjs
      - name: GF-ARCH-17 — salvar, destruir e restaurar em clones isolados
        run: python tests/browser-gf17-save-resume.py
      - name: GF-ARCH-16 — prévia descartável e evidências avançadas no Chromium
        run: python tests/browser-gf16-isolated.py
      - name: GF-ARCH-15 — cenários por requisito no Chromium
        run: python tests/browser-gf15-scenarios.py
      - name: GF-ARCH-14 — evidências e exportação de relatórios no Chromium
        run: python tests/browser-gf14-evidence.py
      - name: GF-ARCH-13 — aprovar e descartar propostas no navegador
        run: python tests/browser-studio-approval.py
      - name: Verificar 14 exportações e editor em Chromium
        run: python tests/browser-export-matrix.py
      - name: GF-TRAIN-20 — 11 cenarios de gameplay real e controle mobile
        run: python tests/browser-gf-train-20-gameplay.py
      - name: GF-TRAIN-21 — retomar progresso no meio da fase no Chromium
        run: python tests/browser-gf-train-21-midstage.py
      - name: GF-005 — Continuar projeto, restaurar GLB e validar perda de armazenamento
        run: python tests/browser-project-continuity-gf005.py
      - name: GF-OPEN-02 — editor WebGL, cena exportada e persistencia
        run: python tests/browser-gf-open-02-scene3d.py
      - name: GF-OPEN-02b — modelos GLB no editor e ZIP no Chromium
        run: python tests/browser-gf-open-02b-glb.py
      - name: GF-OPEN-02c — colisoes e rotas no editor Chromium
        run: python tests/browser-gf-open-02c-navigation.py
      - name: GF-TRAIN-19 — diagnostico Three.js em Chromium
        run: python tests/browser-gf-train-19.py
      - name: GF-TRAIN-22 — treinar interpretacao voxel no navegador
        run: python tests/browser-gf-train-22-voxel.py
      - name: GF-VOXEL-01 — jogar sandbox voxel exportado e restaurar save
        run: python tests/browser-gf-voxel-01.py
      - name: GF-VOXEL-02 — fabricar e restaurar inventario no jogo exportado
        run: python tests/browser-gf-voxel-02.py
      - name: GF-VOXEL-03 — testar corte, replantio e crescimento apos reload
        run: python tests/browser-gf-voxel-03.py
      - name: GF-VOXEL-04 — alimentação e noite no jogo exportado
        run: python tests/browser-gf-voxel-04.py
      - name: GF-VOXEL-06 — baús, drops e restauração no jogo exportado
        run: python tests/browser-gf-voxel-06.py
      - name: GF-VOXEL-07 — ferramentas e desgaste no jogo exportado
        run: python tests/browser-gf-voxel-07.py
      - name: GF-VOXEL-08 — mineração progressiva e forno no jogo exportado
        run: python tests/browser-gf-voxel-08.py
      - name: GF-VOXEL-09 — mundo grande, atlas, greedy e worker
        run: python tests/browser-gf-voxel-09.py
      - name: Salvar capturas do navegador para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf002-browser-screenshots
          path: tests/_browser_output/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  glb_optimizer:
    name: Otimizacao real de GLB (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do mesmo commit
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar glTF-Transform para testes offline
        run: npm install --no-audit --no-fund
      - name: Executar conversao GLB real e validar leitor GameForge
        run: npm run verify:glb-optimizer
