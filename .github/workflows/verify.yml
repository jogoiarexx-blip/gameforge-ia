name: Validar GameForge Studio
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: Sintaxe e regressões (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxe dos módulos
        shell: bash
        run: |
          for f in js/*.js; do node --check "$f"; done
      - name: Testes automatizados
        run: npm test
