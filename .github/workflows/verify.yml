name: Validar GameForge Studio
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: Sintaxe e regressões (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxe dos módulos
        shell: bash
        run: |
          for f in js/*.js; do node --check "$f"; done
      - name: Testes automatizados
        run: npm test
      - name: Bloquear exportacoes com codigo invalido
        run: npm run verify:exports
      - name: Benchmark informativo da arena
        run: npm run bench:arena

  browser:
    name: Exportações reais no Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout do mesmo commit
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Construir exemplos reais para o navegador
        run: node tools/build-browser-fixtures.cjs
      - name: GF-ARCH-18 — recuperar estado urbano 3D em clones isolados
        run: python tests/browser-gf18-3d-persistence.py
      - name: GF-ARCH-17 — salvar, destruir e restaurar em clones isolados
        run: python tests/browser-gf17-save-resume.py
      - name: GF-ARCH-16 — prévia descartável e evidências avançadas no Chromium
        run: python tests/browser-gf16-isolated.py
      - name: GF-ARCH-15 — cenários por requisito no Chromium
        run: python tests/browser-gf15-scenarios.py
      - name: GF-ARCH-14 — evidências e exportação de relatórios no Chromium
        run: python tests/browser-gf14-evidence.py
      - name: GF-ARCH-13 — aprovar e descartar propostas no navegador
        run: python tests/browser-studio-approval.py
      - name: Verificar 14 exportações e editor em Chromium
        run: python tests/browser-export-matrix.py
      - name: GF-005 — Continuar projeto, restaurar GLB e validar perda de armazenamento
        run: python tests/browser-project-continuity-gf005.py
      - name: Salvar capturas do navegador para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf002-browser-screenshots
          path: tests/_browser_output/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
