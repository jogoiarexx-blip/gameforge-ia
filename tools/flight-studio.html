<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GameForge — voo experimental</title>
<style>body{margin:0;background:#101b2d;color:#fff;font:16px system-ui}header{padding:12px}canvas{width:100%;height:min(58vh,540px);display:block;touch-action:none}button,select{padding:12px;margin:3px;border:0;border-radius:8px;font-weight:bold;background:#9ae6cf;color:#102027;touch-action:none}.controls{display:flex;flex-wrap:wrap;justify-content:center;padding:8px}small{display:block;color:#b6d4e8}</style>
<header><strong>GF-TRAIN-28 | Voo livre</strong> <select id="kind"><option value="dragon">Dragão</option><option value="airplane">Avião</option><option value="spaceship">Nave</option></select><button id="restart">Reiniciar</button><div id="hud"></div><small>W acelera, S freia, A/D curva, ↑/↓ inclina, Shift turbo, Espaço dispara. Acelere e incline para cima para decolar. P pausa.</small></header><canvas id="game"></canvas>
<div class="controls"><button data-k="w">Acelerar</button><button data-k="s">Frear</button><button data-k="a">← Curva</button><button data-k="d">Curva →</button><button data-k="arrowup">Subir</button><button data-k="arrowdown">Descer</button><button data-k="shift">Turbo</button><button data-k=" ">Atirar</button><button id="pause">Pausar</button></div>
<script src="../vendor/three-source.js"></script><script src="../js/flight-rules.js"></script><script>
const T=Function(GameForgeThreeSource+';return THREE;')(),F=gameForgeFlightFactory(),el=id=>document.getElementById(id),keys=new Set();
let g=F.create(),paused=false,last=0;
const renderer=new T.WebGLRenderer({canvas:el('game'),antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
const scene=new T.Scene();scene.background=new T.Color(0x8fbad9);scene.fog=new T.Fog(0x8fbad9,100,300);
const cam=new T.PerspectiveCamera(60,1,.1,500);scene.add(new T.HemisphereLight(0xffffff,0x344c32,2));
const ground=new T.GridHelper(240,24,0x245943,0x4e8467);scene.add(ground);
const floor=new T.Mesh(new T.PlaneGeometry(240,240),new T.MeshBasicMaterial({color:0x365f47}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const ship=new T.Group(),hull=new T.Mesh(new T.ConeGeometry(1,4,6),new T.MeshStandardMaterial({color:0x2a86e8}));hull.rotation.x=Math.PI/2;ship.add(hull);
const wings=new T.Mesh(new T.BoxGeometry(6,.15,1.3),new T.MeshStandardMaterial({color:0xe6d596}));ship.add(wings);scene.add(ship);
const enemyMeshes=new Map(),eg=new T.SphereGeometry(1,10,6),em=new T.MeshStandardMaterial({color:0xe95240}),bm=new T.MeshStandardMaterial({color:0x832b82});
const pg=new T.SphereGeometry(.35,6,4),pm=new T.MeshBasicMaterial({color:0xffe87b}),hm=new T.MeshBasicMaterial({color:0xff5533}),pool=[];
for(let i=0;i<96;i++){const m=new T.Mesh(pg,pm);m.visible=false;pool.push(m);scene.add(m);}
function restart(){g=F.create({kind:el('kind').value});paused=false;keys.clear();}
el('kind').onchange=restart;el('restart').onclick=restart;el('pause').onclick=()=>{paused=!paused;keys.clear();el('pause').textContent=paused?'Continuar':'Pausar';};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','shift',' '].includes(k))e.preventDefault();if(k==='p'&&!e.repeat)el('pause').click();keys.add(k);});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();paused=true;el('pause').textContent='Continuar';});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId);};for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k));});
function resize(){const c=el('game'),w=c.clientWidth,h=c.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}addEventListener('resize',resize);resize();
function axis(a,b){return Number(keys.has(a))-Number(keys.has(b));}
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.1,(now-(last||now))/1000);last=now;
 const pad=navigator.getGamepads?.()[0],dead=v=>Math.abs(v||0)>.15?v:0;
 if(!paused)g.update(dt,{turn:axis('d','a')+dead(pad?.axes[0]),pitch:axis('arrowup','arrowdown')-dead(pad?.axes[1]),throttle:axis('w','s')+(pad?.buttons[7]?.value||0)-(pad?.buttons[6]?.value||0),boost:keys.has('shift')||pad?.buttons[4]?.pressed,fire:keys.has(' ')||pad?.buttons[0]?.pressed});
 const s=g.snapshot(),p=s.player;ship.position.set(p.x,p.y,p.z);ship.rotation.set(-p.pitch,p.yaw,p.roll,'YXZ');wings.scale.x=s.kind==='dragon'?1.3:1;
 for(const e of s.enemies){if(!enemyMeshes.has(e.id)){let m=new T.Mesh(eg,e.id==='boss'?bm:em);scene.add(m);enemyMeshes.set(e.id,m);}const m=enemyMeshes.get(e.id);m.visible=e.hp>0;m.position.set(e.x,e.y,e.z);m.scale.setScalar(e.radius);}
 for(let i=0;i<pool.length;i++){const m=pool[i],a=s.shots[i];m.visible=!!a;if(a){m.position.set(a.x,a.y,a.z);m.material=a.hostile?hm:pm;}}
 const c=g.camera();cam.position.lerp(new T.Vector3(c.position.x,c.position.y,c.position.z),1-Math.exp(-8*dt));cam.lookAt(c.focus.x,c.focus.y,c.focus.z);cam.fov=c.fov;cam.updateProjectionMatrix();renderer.render(scene,cam);
 el('hud').textContent=(paused?'PAUSA | ':'')+s.status+' | Altitude '+Math.round(p.y)+' | Vel. '+Math.round(p.speed)+' | Energia '+Math.round(p.energy)+' | Vida '+p.hp+' | Pontos '+s.score+' | Alvo '+(s.lockId||'—')+' | Chefe '+s.phase;
}requestAnimationFrame(frame);
</script></html>
